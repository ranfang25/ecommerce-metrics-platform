version: 1.0.0
metrics:
- metric_id: M01
  name: 观察用户数
  business_definition: 所选事件日期内非空匿名用户标识去重；不是现实人数或GA活跃用户。
  formula: COUNT(DISTINCT user_id)
  numerator: COUNT(DISTINCT user_id)
  denominator: 不适用
  grain: 用户事件
  time_field: event_date
  filters: 事件日期与事件设备/首次来源；排除空用户
  dimensions: device;first_source
  source_table: fact_events
  sql_path: sql/marts/metrics.sql
  exception_policy: 零分母与缺失金额为空；金额保留两位小数；重复冲突交易隔离；同时间戳不判定顺序
  owner_role: 分析维护者（模拟角色）
  version: 1.0.0
  effective_date: '2026-11-11'
  acceptance_case: U01/U03/U09
- metric_id: M02
  name: 有效会话数
  business_definition: 用户标识与会话ID组合有效的会话数；按全快照内最早可见事件日期筛选。
  formula: COUNT(*) fact_sessions
  numerator: COUNT(*) fact_sessions
  denominator: 不适用
  grain: 会话
  time_field: session_date
  filters: 会话日期与最早事件设备/首次来源；用户及会话ID均有效
  dimensions: device;first_source
  source_table: fact_sessions
  sql_path: sql/marts/metrics.sql
  exception_policy: 零分母与缺失金额为空；金额保留两位小数；重复冲突交易隔离；同时间戳不判定顺序
  owner_role: 分析维护者（模拟角色）
  version: 1.0.0
  effective_date: '2026-11-11'
  acceptance_case: U01/U03/U09
- metric_id: M03
  name: 商品浏览会话数
  business_definition: 有效会话内至少出现一次view_item；属于开放阶段统计，不要求完成后续阶段。
  formula: COUNT_IF(has_view)
  numerator: COUNT_IF(has_view)
  denominator: 不适用
  grain: 会话
  time_field: session_date
  filters: 会话日期与最早事件设备/首次来源；用户及会话ID均有效
  dimensions: device;first_source
  source_table: fact_sessions
  sql_path: sql/marts/metrics.sql
  exception_policy: 零分母与缺失金额为空；金额保留两位小数；重复冲突交易隔离；同时间戳不判定顺序
  owner_role: 分析维护者（模拟角色）
  version: 1.0.0
  effective_date: '2026-11-11'
  acceptance_case: U01/U03/U09
- metric_id: M04
  name: 加购会话数
  business_definition: 有效会话内至少出现一次add_to_cart；不要求此前已浏览。
  formula: COUNT_IF(has_cart)
  numerator: COUNT_IF(has_cart)
  denominator: 不适用
  grain: 会话
  time_field: session_date
  filters: 会话日期与最早事件设备/首次来源；用户及会话ID均有效
  dimensions: device;first_source
  source_table: fact_sessions
  sql_path: sql/marts/metrics.sql
  exception_policy: 零分母与缺失金额为空；金额保留两位小数；重复冲突交易隔离；同时间戳不判定顺序
  owner_role: 分析维护者（模拟角色）
  version: 1.0.0
  effective_date: '2026-11-11'
  acceptance_case: U01/U03/U09
- metric_id: M05
  name: 结账会话数
  business_definition: 有效会话内至少出现一次begin_checkout；不要求此前已加购。
  formula: COUNT_IF(has_checkout)
  numerator: COUNT_IF(has_checkout)
  denominator: 不适用
  grain: 会话
  time_field: session_date
  filters: 会话日期与最早事件设备/首次来源；用户及会话ID均有效
  dimensions: device;first_source
  source_table: fact_sessions
  sql_path: sql/marts/metrics.sql
  exception_policy: 零分母与缺失金额为空；金额保留两位小数；重复冲突交易隔离；同时间戳不判定顺序
  owner_role: 分析维护者（模拟角色）
  version: 1.0.0
  effective_date: '2026-11-11'
  acceptance_case: U01/U03/U09
- metric_id: M06
  name: 购买会话数
  business_definition: 有效会话内至少出现一次purchase事件；含交易ID缺失或冲突的购买事件。
  formula: COUNT_IF(has_purchase)
  numerator: COUNT_IF(has_purchase)
  denominator: 不适用
  grain: 会话
  time_field: session_date
  filters: 会话日期与最早事件设备/首次来源；用户及会话ID均有效
  dimensions: device;first_source
  source_table: fact_sessions
  sql_path: sql/marts/metrics.sql
  exception_policy: 零分母与缺失金额为空；金额保留两位小数；重复冲突交易隔离；同时间戳不判定顺序
  owner_role: 分析维护者（模拟角色）
  version: 1.0.0
  effective_date: '2026-11-11'
  acceptance_case: U01/U03/U09
- metric_id: M07
  name: 有效交易数
  business_definition: 购买日期内可识别且无日期、用户、会话、金额冲突的唯一交易ID数；一致重复合并。
  formula: COUNT(*) fact_orders
  numerator: COUNT(*) fact_orders
  denominator: 不适用
  grain: 交易
  time_field: purchase_date
  filters: 购买日期与归属会话设备/首次来源；有效交易，冲突隔离
  dimensions: device;first_source
  source_table: fact_orders
  sql_path: sql/marts/metrics.sql
  exception_policy: 零分母与缺失金额为空；金额保留两位小数；重复冲突交易隔离；同时间戳不判定顺序
  owner_role: 分析维护者（模拟角色）
  version: 1.0.0
  effective_date: '2026-11-11'
  acceptance_case: U01/U03/U09
- metric_id: M08
  name: 已记录购买金额（USD）
  business_definition: 与M07相同有效交易集合中的可用purchase_revenue_usd之和；固定USD，缺失不补零。
  formula: SUM(revenue_usd)
  numerator: SUM(revenue_usd)
  denominator: 不适用
  grain: 交易
  time_field: purchase_date
  filters: 购买日期与归属会话设备/首次来源；有效交易，冲突隔离
  dimensions: device;first_source
  source_table: fact_orders
  sql_path: sql/marts/metrics.sql
  exception_policy: 零分母与缺失金额为空；金额保留两位小数；重复冲突交易隔离；同时间戳不判定顺序
  owner_role: 分析维护者（模拟角色）
  version: 1.0.0
  effective_date: '2026-11-11'
  acceptance_case: U01/U03/U09
- metric_id: M09
  name: 金额完整订单客单价
  business_definition: 有可用USD金额的有效交易金额均值；分母是金额完整交易数，不能使用全部交易数。
  formula: SUM(revenue_usd)/COUNT(revenue_usd)
  numerator: SUM(revenue_usd)
  denominator: COUNT(revenue_usd)
  grain: 交易
  time_field: purchase_date
  filters: 购买日期与归属会话设备/首次来源；有效交易，冲突隔离
  dimensions: device;first_source
  source_table: fact_orders
  sql_path: sql/marts/metrics.sql
  exception_policy: 零分母与缺失金额为空；金额保留两位小数；重复冲突交易隔离；同时间戳不判定顺序
  owner_role: 分析维护者（模拟角色）
  version: 1.0.0
  effective_date: '2026-11-11'
  acceptance_case: U01/U03/U09
- metric_id: M10
  name: 会话购买转化率
  business_definition: 同一日期与维度范围内的购买会话数除以有效会话数；不是交易转化或闭合漏斗转化。
  formula: M06/M02
  numerator: M06
  denominator: M02
  grain: 会话
  time_field: session_date
  filters: 会话日期与最早事件设备/首次来源；用户及会话ID均有效
  dimensions: device;first_source
  source_table: fact_sessions
  sql_path: sql/marts/metrics.sql
  exception_policy: 零分母与缺失金额为空；金额保留两位小数；重复冲突交易隔离；同时间戳不判定顺序
  owner_role: 分析维护者（模拟角色）
  version: 1.0.0
  effective_date: '2026-11-11'
  acceptance_case: U01/U03/U09
- metric_id: M11
  name: 浏览到加购转化率
  business_definition: 同一有效会话内，最早浏览之后找到严格更晚的最早加购；有序加购会话除以进入浏览会话。
  formula: COUNT(cart_ts)/COUNT(view_ts)
  numerator: COUNT(cart_ts)
  denominator: COUNT(view_ts)
  grain: 会话
  time_field: session_date
  filters: 会话日期与最早事件设备/首次来源；用户及会话ID均有效
  dimensions: device;first_source
  source_table: fact_sessions
  sql_path: sql/marts/metrics.sql
  exception_policy: 零分母与缺失金额为空；金额保留两位小数；重复冲突交易隔离；同时间戳不判定顺序
  owner_role: 分析维护者（模拟角色）
  version: 1.0.0
  effective_date: '2026-11-11'
  acceptance_case: U04/U05/U09
- metric_id: M12
  name: 结账到购买转化率
  business_definition: 完整view_item→add_to_cart→begin_checkout链路之后，严格更晚的最早purchase；分母为同一链路到达结账的会话。
  formula: COUNT(purchase_ts)/COUNT(checkout_ts)
  numerator: COUNT(purchase_ts)
  denominator: COUNT(checkout_ts)
  grain: 会话
  time_field: session_date
  filters: 会话日期与最早事件设备/首次来源；用户及会话ID均有效
  dimensions: device;first_source
  source_table: fact_sessions
  sql_path: sql/marts/metrics.sql
  exception_policy: 零分母与缺失金额为空；金额保留两位小数；重复冲突交易隔离；同时间戳不判定顺序
  owner_role: 分析维护者（模拟角色）
  version: 1.0.0
  effective_date: '2026-11-11'
  acceptance_case: U04/U05/U09
